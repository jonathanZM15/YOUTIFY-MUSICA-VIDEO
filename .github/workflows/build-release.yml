name: Build and publish Windows installer

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Prepare verified FFmpeg and JavaScript runtime
        run: python scripts/prepare_components.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os; from config.settings import APP_VERSION; assert os.environ['RELEASE_TAG'] == 'v' + APP_VERSION, 'Tag/version mismatch'"

      - name: Build executable and check bundled components
        run: python scripts/build.py --skip-tests

      - name: Ensure Inno Setup compiler
        run: |
          $compilerPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compilerPath)) {
            choco install innosetup --version=6.5.4 --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          if (-not (Test-Path -LiteralPath $compilerPath)) { throw "Inno Setup compiler not found" }

      - name: Build executable installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Package automatic update and release checksums
        run: python scripts/package_release.py

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Youtify-Windows
          path: |
            installer/Youtify-Setup.exe
            installer/SHA256SUMS.txt
            installer/Youtify-Update-x64.zip
            build/packaged-check.json
            build/components/manifest.json

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested installer
        uses: actions/download-artifact@v4
        with:
          name: Youtify-Windows
          path: release
      - name: Publish GitHub Release (v*.*.*)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/installer/Youtify-Setup.exe
            release/installer/SHA256SUMS.txt
            release/installer/Youtify-Update-x64.zip
