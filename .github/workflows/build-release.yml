name: Build and publish Windows installer

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --noconsole --onefile --clean --icon=icon.ico --name Youtify app.py

      - name: Download and bundle FFmpeg
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp"
          New-Item -ItemType Directory -Force -Path "ffmpeg"
          Get-ChildItem -Path "ffmpeg_temp" -Recurse -Filter "ffmpeg.exe" | Copy-Item -Destination "ffmpeg\"
          Get-ChildItem -Path "ffmpeg_temp" -Recurse -Filter "ffprobe.exe" | Copy-Item -Destination "ffmpeg\"
          Remove-Item -Recurse -Force "ffmpeg_temp", "ffmpeg.zip"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Youtify-Windows
          path: installer/Youtify-Setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: installer/Youtify-Setup.exe
